<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Love</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <div class="hearts-layer" id="hearts-layer"></div>

        <div class="card">
            <div class="badge">Forever & Always</div>
            <h1>You Are My <span>Love</span></h1>
            <p>
                Every moment with you feels warm, beautiful, and full of magic.
                Your smile turns ordinary days into unforgettable memories, and your love makes my heart feel at home.
            </p>

            <div class="actions">
                <button class="primary-btn" id="loveButton">My Heart</button>
                <button class="secondary-btn" id="resetButton">Sweet Message</button>
            </div>

            <div class="transform-stage">
                <div class="heart-planet" id="heartPlanet" aria-label="Animated heart">
                    <span class="heart-shape"></span>
                    <span class="orbit orbit-1"></span>
                    <span class="orbit orbit-2"></span>
                    <span class="orbit orbit-3"></span>
                    <span class="planet planet-1"></span>
                    <span class="planet planet-2"></span>
                    <span class="planet planet-3"></span>
                </div>
            </div>

            <div class="message" id="message">
                A little love is enough to brighten the whole world.
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
